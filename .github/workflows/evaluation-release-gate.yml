# AgentEvalOps Evaluation Candidate Gate
#
# This is the canonical release candidate gate. The selected integration
# node starts a real LocalAgent production composition, creates persisted
# baseline/good-candidate and baseline/known-bad-candidate runs, and invokes
# scripts.ci.release_gate with those persisted IDs. The workflow intentionally
# does not provide a fixture input or accept caller-supplied run IDs.

name: AgentEvalOps Evaluation Candidate Gate

on:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evaluation-release-gate:
    name: Real LocalAgent Evaluation Candidate Gate
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    permissions:
      contents: read

    env:
      # Separate databases and Redis namespaces keep the two real stacks
      # isolated while sharing the ephemeral CI services.
      AGENTEVALOPS_GATE_DATABASE_URL: postgresql+asyncpg://postgres@localhost:5432/pandaprobe_ci
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: pandaprobe_ci
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ""
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
      REDIS_DB: "0"

    steps:
      - uses: actions/checkout@v6

      - name: Checkout LocalAgent production runtime
        uses: actions/checkout@v6
        with:
          repository: gemhr/Local_Agent
          ref: main
          path: localagent
          token: ${{ secrets.LOCALAGENT_REPO_TOKEN || github.token }}
          persist-credentials: false

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: |
            backend/uv.lock
            localagent/uv.lock

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install AgentEvalOps dependencies
        run: make backend-install

      - name: Install LocalAgent dependencies
        working-directory: localagent
        run: uv sync --frozen

      - name: Create isolated candidate-gate databases
        env:
          PGPASSWORD: ""
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "CREATE DATABASE pandaprobe_ci"
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "CREATE DATABASE localagent_ci"

      - name: Prepare AgentEvalOps schema
        working-directory: backend
        run: uv run alembic upgrade head

      - name: Prepare LocalAgent schema
        working-directory: localagent
        env:
          LOCAL_AGENT_DATABASE_URL: postgresql+asyncpg://postgres@localhost:5432/localagent_ci
          LOCAL_AGENT_ENVIRONMENT_PROFILE: TEST
          LOCAL_AGENT_LLM_BACKEND: scripted
          LOCAL_AGENT_RUNTIME_PROFILE: EPISODIC_EVALUATION_LAYER1
          LOCAL_AGENT_REDIS_URL: redis://localhost:6379/1
        run: uv run alembic upgrade head

      - name: Create ephemeral LocalAgent service identity
        shell: bash
        env:
          LOCAL_AGENT_DATABASE_URL: postgresql+asyncpg://postgres@localhost:5432/localagent_ci
          LOCAL_AGENT_ENVIRONMENT_PROFILE: TEST
          LOCAL_AGENT_LLM_BACKEND: scripted
          LOCAL_AGENT_RUNTIME_PROFILE: EPISODIC_EVALUATION_LAYER1
          LOCAL_AGENT_REDIS_URL: redis://localhost:6379/1
        run: |
          set -euo pipefail
          private_key="$RUNNER_TEMP/localagent-jwt-private.pem"
          public_key="$RUNNER_TEMP/localagent-jwt-public.pem"
          openssl genpkey -algorithm Ed25519 -out "$private_key"
          openssl pkey -in "$private_key" -pubout -out "$public_key"
          export LOCAL_AGENT_JWT_PRIVATE_KEY="$(cat "$private_key")"
          export LOCALAGENT_E2E_JWT_PUBLIC_KEY="$(cat "$public_key")"
          export LOCAL_AGENT_JWT_PUBLIC_KEY="$LOCALAGENT_E2E_JWT_PUBLIC_KEY"
          {
            echo 'LOCALAGENT_E2E_JWT_PUBLIC_KEY<<LOCALAGENT_PUBLIC_KEY'
            echo "$LOCALAGENT_E2E_JWT_PUBLIC_KEY"
            echo 'LOCALAGENT_PUBLIC_KEY'
          } >> "$GITHUB_ENV"
          service_id="$(uv run python -m scripts.manage_identity create-service \
            --display-name ci-candidate-gate)"
          service_token="$(uv run python -m scripts.manage_identity issue-test-token "$service_id" --ttl 900)"
          echo "::add-mask::$service_token"
          {
            echo 'LOCALAGENT_E2E_SERVICE_TOKEN<<LOCALAGENT_SERVICE_TOKEN'
            echo "$service_token"
            echo 'LOCALAGENT_SERVICE_TOKEN'
          } >> "$GITHUB_ENV"

      - name: Run real persisted candidate gate
        working-directory: backend
        env:
          AGENTEVALOPS_RUN_LOCALAGENT_PRODUCTION_E2E: "1"
          AGENTEVALOPS_GATE_DATABASE_URL: postgresql+asyncpg://postgres@localhost:5432/pandaprobe_ci
          LOCALAGENT_E2E_REPO: ${{ github.workspace }}/localagent
          LOCALAGENT_E2E_PYTHON_EXECUTABLE: ${{ github.workspace }}/localagent/.venv/bin/python
          LOCALAGENT_E2E_DATABASE_URL: postgresql+asyncpg://postgres@localhost:5432/localagent_ci
          LOCALAGENT_E2E_REDIS_URL: redis://localhost:6379/1
          LOCALAGENT_E2E_HEALTH_TIMEOUT: "120"
          AGENTEVALOPS_CANDIDATE_GATE_RUN_IDS_PATH: ${{ github.workspace }}/backend/artifacts/candidate-gate-run-ids.json
          AGENTEVALOPS_CANDIDATE_GATE_REPORT_DIR: ${{ github.workspace }}/backend/artifacts
        run: >-
          uv run pytest
          tests/integration/test_localagent_production_e2e.py::test_real_known_bad_candidate_fails_canonical_gate
          -q

      - name: Upload candidate-gate evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: evaluation-candidate-gate
          path: backend/artifacts/
          if-no-files-found: error
